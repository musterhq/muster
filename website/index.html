</head><body><div id="root"></div><noscript><main style="background:#08080a;color:white;padding:60px;font:18px Arial"><h1>Muster Agent: the open-source AI coding agent desktop app</h1><img src="/assets/muster-wordmark.svg" alt="Muster Agent wordmark" width="1200" height="270" style="width:100%;max-width:1100px;height:auto" /><p>An open-source workspace for agents across chat, projects and code.</p><h2>Messaging gateway</h2><p>Configure a provider and messaging channel with the CLI gateway.</p><h2>Muster Agent desktop</h2><p>Work with projects, agents, local notes and code review. Hindsight recall is optional.</p><h2>Connections</h2><p>Paperclip integration is available. The native headless local-server path is in progress.</p><p><a style="color:#deaa75" href="https://themuster.dev/docs.html">Set up messaging</a> · <a style="color:#deaa75" href="https://themuster.dev/download.html">Get desktop app</a></p><p>Messaging gateway and desktop are separate entry points. The full connected story is illustrative.</p></main><p><a href="/overview.html">Technical overview, integrations and audit evidence</a> · <a href="/guides.html">Guides</a></p></noscript><script type="module" src="/src/story/main.jsx"></script></body></html>
